[package]
name = "top-scroll-brightness"
version = "1.0.0"
edition = "2024"
description = "Scroll with the pointer at the top edge of a screen to change that monitor's brightness over DDC/CI."
build = "build.rs"

[[bin]]
name = "TopScrollBrightness"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
